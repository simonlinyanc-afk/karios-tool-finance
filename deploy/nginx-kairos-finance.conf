# Place this file under the nginx http context, for example in conf.d/.
# The two referenced credential files must be created on the server and kept outside the repository.

limit_req_zone $binary_remote_addr zone=kairos_ocr:10m rate=10r/m;

upstream kairos_finance_node {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name finance.internal.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finance.internal.example;

    ssl_certificate /etc/nginx/tls/finance.internal.example/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/finance.internal.example/privkey.pem;

    client_max_body_size 15m;

    # Protect the complete internal site before any static page or API is served.
    auth_basic "Kairos Finance internal";
    auth_basic_user_file /etc/nginx/secrets/kairos-finance.htpasswd;

    location = /api/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_pass http://kairos_finance_node;
    }

    location = /api/ocr {
        limit_req zone=kairos_ocr burst=5 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-OCR-Token-Source "nginx";

        # This external root-owned file must overwrite Authorization with the
        # same internal credential configured in the Node process environment.
        # Example content, kept outside git:
        #   proxy_set_header Authorization "Bearer <OCR_ACCESS_TOKEN>";
        # If this snippet is missing or empty, production Node will reject OCR.
        include /etc/nginx/snippets/kairos-finance-ocr-auth.conf;

        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_pass http://kairos_finance_node;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_pass http://kairos_finance_node;
    }
}
